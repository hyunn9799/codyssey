<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할 일 수정</title>
     <!-- 구글 폰트에서 Noto Sans KR 불러오기 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        {% if task %}
            <h1>할 일 수정</h1>

            <form method="post" action="/tasks/{{ task.id }}/edit">
                <div class="form-group">
                    <label for="title">제목</label>
                    <input type="text" id="title" name="title" value="{{ task.title }}" required>
                </div>

                <div class="form-group">
                    <label for="description">설명</label>
                    <textarea id="description" name="description">{{ task.description }}</textarea>
                </div>

                <div class="form-group">
                    <label for="due_date">마감일</label>
                    <input type="date" id="due_date" name="due_date" value="{{ task.due_date }}">
                </div>

                <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem;">수정 저장</button>
            </form>

            <div class="actions-nav">
                <a href="/tasks/{{ task.id }}" class="btn btn-secondary" style="flex: 1;">상세로</a>
                <a href="/tasks" class="btn btn-secondary" style="flex: 1;">목록으로</a>
            </div>
        {% else %}
            <div class="empty-state">
                <span class="empty-icon">⚠️</span>
                <p>수정할 할 일을 찾을 수 없습니다.</p>
            </div>
            <div class="actions-nav">
                <a href="/tasks" class="btn btn-primary" style="flex: 1;">목록으로</a>
            </div>
        {% endif %}
    </div>
</body>
</html>
