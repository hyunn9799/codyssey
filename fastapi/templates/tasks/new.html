<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>새 할 일 작성</title>
     <!-- 구글 폰트에서 Noto Sans KR 불러오기 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=2">
</head>
<body>
    <div class="container">
        <h1>{{ project.name }} - 새 할 일 작성</h1>

        <form method="post" action="/projects/{{ project.id }}/tasks">
            <div class="form-group">
                <label for="title">제목</label>
                <input type="text" id="title" name="title" placeholder="할 일 제목을 입력하세요" required>
            </div>

            <div class="form-group">
                <label for="description">설명</label>
                <textarea id="description" name="description" placeholder="상세 설명을 입력하세요"></textarea>
            </div>

            <div class="form-group">
                <label for="due_date">마감일</label>
                <input type="date" id="due_date" name="due_date">
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 0.5rem;">저장</button>
        </form>

        <div class="actions-nav">
            <a href="/projects/{{ project.id }}" class="btn btn-secondary" style="flex: 1;">프로젝트 상세로</a>
        </div>
    </div>
</body>
</html>
